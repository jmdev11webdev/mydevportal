<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#070b12" />
        <title>MyDevPortal is offline</title>
        <style>
            :root {
                color-scheme: dark;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: #070b12;
                color: #e2e8f0;
                font-family:
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    sans-serif;
                padding: 24px;
            }

            .card {
                max-width: 420px;
                text-align: center;
                border: 1px solid rgba(255, 255, 255, 0.1);
                background: rgba(255, 255, 255, 0.03);
                border-radius: 20px;
                padding: 40px 28px;
            }

            .mark {
                width: 48px;
                height: 48px;
                margin: 0 auto 18px;
                display: grid;
                place-items: center;
                border-radius: 14px;
                background: #fff;
                color: #0f172a;
                font-weight: 700;
                font-size: 18px;
            }

            h1 {
                font-size: 20px;
                margin: 0 0 8px;
            }

            p {
                margin: 0;
                font-size: 14px;
                color: #94a3b8;
                line-height: 1.6;
            }

            a {
                display: inline-block;
                margin-top: 20px;
                padding: 10px 18px;
                border-radius: 10px;
                background: #fff;
                color: #0f172a;
                font-size: 13px;
                font-weight: 600;
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="mark">&gt;_</div>
            <h1>You're offline</h1>
            <p>
                MyDevPortal needs a connection to sync your workspace. Your
                saved notes will be here when you're back.
            </p>
            <a href="/">Try again</a>
        </div>
    </body>
</html>
